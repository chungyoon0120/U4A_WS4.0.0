[project]
name = "sap-adt-mcp-server"
version = "0.1.0"
description = "MCP server for SAP ABAP Development Tools (ADT) — read-only / inspection tools over the ADT REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
sap-adt-mcp = "sap_adt_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sap_adt_mcp"]
