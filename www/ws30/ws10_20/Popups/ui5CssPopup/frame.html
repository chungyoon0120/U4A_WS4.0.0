<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta charset="utf-8">
    <link rel="stylesheet" href="frame.css">

    <!-- [흰 플래시 방지] opener 가 넘긴 BGCOL 을 첫 페인트 전 배경으로(셸 html/body + 본문 iframe 요소).
         테마 인프라가 없어 BGCOL 직접 적용. 본문(ws_frame) 로드 전까지 흰색 차단. -->
    <script>
        (function () {
            try {
                var bg = new URLSearchParams(location.search).get("BGCOL");
                if (bg) {
                    var s = document.createElement("style");
                    s.textContent = "html,body,#ws_frame{background:" + bg + ";}";
                    document.head.appendChild(s);
                }
            } catch (e) { }
        })();
    </script>
</head>
<style>
    html,
    body {
        height: 100%;
    }

    body {
        margin: 0px;
        overflow: hidden;
    }
</style>

<body>
   
    <iframe id="ws_frame" name="ws_frame" style="border:none;width:100%;height:100%;" allowfullscreen>
    </iframe>

    <form id="ws_form" method="POST" target="ws_frame">

    </form>

    <!-- Busy Indicator Start -->
    <div id="u4aWsBusyIndicator" data-sap-ui-popup="id-1622786200065-234" class="u4aWsBusyIndicator sapUiUserSelectable"

        <div class="sapUiBusy" tabindex="0" role="progressbar" alt="" title="Please wait"></div>
        <div class="sapUiLocalBusyIndicator sapUiLocalBusyIndicatorSizeBig sapUiLocalBusyIndicatorFade"
            role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuetext="Busy" alt="" tabindex="0"
            title="Please wait">
            <div class="sapUiLocalBusyIndicatorAnimation sapUiLocalBusyIndicatorAnimStandard">
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
    </div>

    
    <!-- Busy Indicator End -->

    <script>
        /************************************************************************
         * 에러 감지
         ************************************************************************/
         var REMOTE = require('@electron/remote'),
            PATH = REMOTE.require('path'),
            APP = REMOTE.app,
            APPPATH = APP.getAppPath(),
            PATHINFOURL = PATH.join(APPPATH, "ws30", "resources", "pathInfo.js"),
            PATHINFO = require(PATHINFOURL),
            WSERR = require(PATHINFO.WSTRYCATCH);

        var zconsole = WSERR(window, document, console);
    </script>

    <script src="frame.js"></script>
</body>

</html>
