<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <section class="theme-page">
        <header class="theme-title">
            <h1 id="themeTitle" data-opt-msg-cls="/U4A/CL_WS_COMMON" data-opt-msg-no="C65"></h1>
            <div class="theme-toolbar-field">
                <select id="themeSelect" aria-labelledby="themeTitle"></select>
            </div>
            <button id="themeHelpButton" class="opt-help-button" type="button" data-opt-aria-msg-cls="ZMSG_WS_COMMON_001" data-opt-aria-msg-no="198" data-opt-title-msg-cls="ZMSG_WS_COMMON_001" data-opt-title-msg-no="198">
                <span data-sap-icon="sap-icon://u4a-fw-regular/Circle Question"></span>
            </button>
        </header>

        <div class="theme-preview-wrap">
            <img id="themePreview" class="theme-preview" alt="theme preview">
        </div>

        <footer class="theme-footer">
            <button id="applyTheme" class="theme-apply" type="button">
                <span class="theme-apply__icon" data-sap-icon="sap-icon://u4a-fw-solid/Check"></span>
                <span data-opt-msg-cls="ZMSG_WS_COMMON_001" data-opt-msg-no="232"></span>
            </button>
        </footer>
    </section>

    <script src="../common/util.js"></script>
    <script src="../common/iconFont.js"></script>
    <script src="../common/popup.js"></script>
    <script src="index.js"></script>
</body>

</html>
