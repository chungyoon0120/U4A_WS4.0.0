<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

    <!-- ===== 공통 헤더(.u4a-titlebar)·버튼·토큰 (versionMng/MIME 동일 스택) =====
         원본: iconPrevPopup(UI5 별도창) — sap.m.App 안 customHeader Toolbar 가 창 크롬(로고/제목/min·max·close)까지 그림.
         HTML5: 창 크롬만 [공통 .u4a-titlebar] 로 외부화(frameless). 본문(아이콘 리스트)은 서버 getP13nPreviewHTML(UI5)
                을 로드하는 iframe = KEEP-UI5(runtime.js 그대로 iframe 안에서 동작).
         경로: Popups/iconPrevPopup 기준 → theme=../../theme, lib=../../../../lib. (browser-window-common-ux) -->
    <link rel="stylesheet" href="../../theme/tokens.css">
    <link rel="stylesheet" href="../../theme/shell.css">
    <link rel="stylesheet" href="../../theme/bootstrap-skin.css">
    <link rel="stylesheet" href="../../../../lib/fontawesome/7.2.0/css/all.min.css">

    <script src="../../theme/theme-api.js"></script>
    <script src="../../theme/u4a-ui.js"></script>

    <!-- [흰색 플래시 방지 — 동기] opener 가 넘긴 BGCOL/THEME/TITLE 을 첫 페인트 전에 적용 -->
    <script>
        (function () {
            try {
                var q = new URLSearchParams(location.search);
                var sBg = q.get("BGCOL");
                if (sBg) { document.documentElement.style.setProperty("--boot-bg", sBg); }
                var sTheme = q.get("THEME");
                if (sTheme && window.U4ATheme) {
                    window.U4ATheme.apply(window.U4ATheme.normalize ? window.U4ATheme.normalize(sTheme) : sTheme);
                }
                var sTitle = q.get("TITLE");
                if (sTitle) { document.title = sTitle; }
            } catch (e) { /* index.js 에서 재적용 */ }
        })();
    </script>

    <style>
        html, body { margin: 0; height: 100%; }
        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--boot-bg, var(--app-bg));
        }
        /* 본문 = 서버 UI5 아이콘 리스트 iframe (타이틀바 아래 나머지 전부) */
        #ws_frame {
            flex: 1 1 auto;
            width: 100%;
            min-height: 0;
            border: 0;
            display: block;
        }
        /* [흰색 플래시 방지 — iframe]
           본문은 KEEP-UI5(서버 문서)라 --boot-bg 가 안 먹고, Chromium 이 서브프레임 캔버스를 흰색으로
           먼저 그린다(다크 테마에서 흰 배경이 번쩍임). 서버 UI5 부팅 완료(runtime.js attachInit →
           parent.oAPP.fn.setShellBusy(false)) 전까지 숨겨 호스트 --boot-bg 만 보이게 한다.
           원본 $('#content').fadeIn(300) 과 동일한 계층의 처리. */
        #ws_frame {
            visibility: hidden;
            opacity: 0;
            transition: opacity .2s linear;
        }
        #ws_frame.is-ready {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>

<body>

    <!-- ===== 공통 커스텀 헤더(frameless) — 로고/제목/min·max·close (versionMng·MIME 동일) ===== -->
    <header class="u4a-titlebar" id="iconpTitlebar">
        <img class="u4a-titlebar__logo" id="iconpLogo" src="" alt="U4A">
        <span class="u4a-titlebar__title" id="iconpTitle"></span>
        <div class="u4a-titlebar__spacer"></div>
        <button type="button" class="u4a-winbtn" id="iconpWinMin" title="Minimize"><i class="fa-solid fa-window-minimize"></i></button>
        <button type="button" class="u4a-winbtn" id="iconpWinMax" title="Maximize"><i class="fa-solid fa-window-maximize"></i></button>
        <button type="button" class="u4a-winbtn u4a-winbtn--close" id="iconpWinClose" data-action="close" title="Close"><i class="fa-solid fa-xmark"></i></button>
    </header>

    <!-- 본문 = 서버 getP13nPreviewHTML(UI5 부트스트랩) 을 로드하는 iframe. 콘텐츠=KEEP-UI5(runtime.js). -->
    <iframe id="ws_frame" src="" frameborder="0" name="u4aForm"></iframe>

    <form method="post" id="u4asendform" target="u4aForm"></form>

    <!-- Busy 오버레이 — ★공통 .u4a-busy★(shell.css 단일 출처). 초기 서버 UI5 로드 중 표시,
         runtime.js 부팅 완료(attachInit) 시 oAPP.fn.setShellBusy(false) 로 해제. -->
    <div id="iconpBusy" class="u4a-busy" data-busy="true" role="progressbar" aria-valuetext="Busy">
        <div class="u4a-busy__card">
            <div class="u4a-busy__spinner"></div>
        </div>
    </div>

    <script src="index.js"></script>

</body>

</html>
