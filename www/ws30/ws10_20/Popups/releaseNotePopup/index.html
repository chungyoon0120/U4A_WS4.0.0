<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title></title>

    <!-- [흰 플래시 방지] opener 가 넘긴 BGCOL 을 첫 페인트 전 배경으로(셸 html/body + 본문 iframe 요소).
         이 셸은 tokens.css/테마 인프라가 없어 BGCOL 직접 적용. 본문(mainFRAME) 로드 전까지 흰색 차단. -->
    <script>
        (function () {
            try {
                var bg = new URLSearchParams(location.search).get("BGCOL");
                if (bg) {
                    var s = document.createElement("style");
                    s.textContent = "html,body,#mainFRAME{background:" + bg + ";}";
                    document.head.appendChild(s);
                }
            } catch (e) { }
        })();
    </script>
</head>

<body style="margin:0px;padding:0px;overflow:hidden">

    <iframe id="mainFRAME"
            src=""
            frameborder="0"
            style="overflow:hidden;overflow-x:hidden;overflow-y:hidden;height:100%;width:100%;position:absolute;top:0px;left:0px;right:0px;bottom:0px;">
    </iframe>

    <script>
        /************************************************************************
         * 에러 감지
         ************************************************************************/
        var REMOTE = require('@electron/remote'),
            PATH = REMOTE.require('path'),
            APP = REMOTE.app,
            APPPATH = APP.getAppPath(),
            PATHINFOURL = PATH.join(APPPATH, "ws30", "resources", "pathInfo.js"),
            PATHINFO = require(PATHINFOURL),
            WSERR = require(PATHINFO.WSTRYCATCH);

        var zconsole = WSERR(window, document, console);
    </script>

    <script src="js/index.js"></script>
</body>

</html>
