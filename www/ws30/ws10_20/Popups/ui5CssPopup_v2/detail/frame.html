<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta charset="utf-8">

    <!-- ==================================================================================
         [HTML5] 별도창(win=X)일 때만 공통 frameless 크롬 활성화. (browser-window-common-ux / .analy/16 §2.6)
           · 이 페이지는 인팝업 미리보기 iframe 으로도 겸용 → win 없으면 아무것도 안 함(기존 동작 100% 보존).
           · minimize 버튼 제외(장군님 지시) — 로고/제목/최대화/닫기만.
         ================================================================================== -->
    <script>
        // 창 크롬 배선 — 공통 자산(theme-api/u4a-ui) 로드 완료 후 호출. (안전망에서도 호출되므로 1회 가드)
        window._u4aInitWinChrome = function () {
            if (window.__u4aChromeDone) { return; }   // 정상경로/안전망 중복 호출 방지
            window.__u4aChromeDone = true;
            try {
                var REMOTE = require('@electron/remote');
                var CURRWIN = REMOTE.getCurrentWindow();
                var PATH = REMOTE.require('path');
                var APPPATH = REMOTE.app.getAppPath();

                try { CURRWIN.setMenu(null); } catch (e) { }
                try { if (window.U4AUI && U4AUI.initWindowFocusState) { U4AUI.initWindowFocusState(); } } catch (e) { }

                // 로고
                var oLogo = document.getElementById("dtlLogo");
                if (oLogo) { try { oLogo.src = encodeURI("file:///" + PATH.join(APPPATH, "img", "logo.png").replace(/\\/g, "/")); } catch (e) { } }
                // 제목(opener 가 넘긴 TITLE → document.title)
                var oTitle = document.getElementById("dtlTitle");
                if (oTitle) { oTitle.textContent = document.title || ""; }

                // 최대화/복원 토글 + 아이콘 스왑 (minimize 없음)
                var oMax = document.getElementById("dtlWinMax");
                function _syncMax() {
                    var i = oMax && oMax.querySelector("i");
                    if (!i) { return; }
                    var m = false; try { m = CURRWIN.isMaximized(); } catch (e) { }
                    i.className = m ? "fa-solid fa-window-restore" : "fa-solid fa-window-maximize";
                }
                if (oMax) { oMax.addEventListener("click", function () { try { CURRWIN.isMaximized() ? CURRWIN.unmaximize() : CURRWIN.maximize(); } catch (e) { } }); }
                try { CURRWIN.on("maximize", _syncMax); CURRWIN.on("unmaximize", _syncMax); } catch (e) { }
                _syncMax();

                // 닫기 — closable:false 라 직접 close 불가 → 공통 U4AUI.closeWindow(.analy/16 §2.6.1)
                var oClose = document.getElementById("dtlWinClose");
                if (oClose) {
                    oClose.addEventListener("click", function () {
                        if (window.U4AUI && U4AUI.closeWindow) { U4AUI.closeWindow(CURRWIN); }
                        else { try { CURRWIN.setClosable(true); CURRWIN.close(); } catch (e) { } }
                    });
                }

                // 위치는 opener 가 잡음 → 스타일/배선 끝났으니 표시(흰 플래시 없음).
                try { CURRWIN.show(); } catch (e) { }
            } catch (e) {
                console.error("[ui5CssPopup detail win] 크롬 배선 오류:", e && e.message);
                try { require('@electron/remote').getCurrentWindow().show(); } catch (e2) { }
            }
        };

        (function () {
            try {
                var q = new URLSearchParams(location.search);
                if (q.get("win") !== "X") { return; }   // 임베드 미리보기 = 크롬 없음(기존 유지)

                var d = document.documentElement;
                d.setAttribute("data-u4a-win", "X");
                var bg = q.get("BGCOL"); if (bg) { d.style.setProperty("--boot-bg", bg); }   // 흰 플래시 방지(동기)
                var t = q.get("TITLE"); if (t) { document.title = t; }

                var head = document.getElementsByTagName("head")[0];
                function _css(h) { var l = document.createElement("link"); l.rel = "stylesheet"; l.href = h; head.appendChild(l); }
                _css("../../../theme/tokens.css");
                _css("../../../theme/shell.css");
                _css("../../../theme/bootstrap-skin.css");
                _css("../../../../../lib/fontawesome/7.2.0/css/all.min.css");

                function _js(s, cb) { var el = document.createElement("script"); el.src = s; el.onload = cb || null; head.appendChild(el); }
                _js("../../../theme/theme-api.js", function () {
                    try { var th = q.get("THEME"); if (th && window.U4ATheme) { U4ATheme.apply(U4ATheme.normalize ? U4ATheme.normalize(th) : th); } } catch (e) { }
                    _js("../../../theme/u4a-ui.js", function () { window._u4aInitWinChrome(); });
                });

                // 안전망: 공통 자산(theme-api/u4a-ui) 로드 실패로 정상 배선(onload 콜백)이 안 됐어도,
                //   여기서 크롬 배선을 수행해 ★닫기 버튼을 반드시 살린다★ — closable:false 인데 배선 안 되면
                //   타이틀바 닫기도 Alt+F4 도 안 먹는 영구 잠금이 됨. _u4aInitWinChrome 은 require(remote)만 있으면
                //   동작하고 U4AUI 는 선택적(없으면 setClosable+close 폴백)이라 스크립트 실패시에도 닫기 가능.
                //   (1회 가드가 있어 정상경로와 중복 호출돼도 안전). 실제 load 이벤트 기반(타이머 아님).
                window.addEventListener("load", function () {
                    try { window._u4aInitWinChrome(); }
                    catch (e) { try { require('@electron/remote').getCurrentWindow().show(); } catch (e2) { } }
                });
            } catch (e) { }
        })();
    </script>
</head>
<style>
    html,
    body {
        height: 100%;
    }

    body {
        margin: 0px;
        overflow: hidden;
    }

    /* 본문 iframe — 임베드(미리보기): 100% 채움 (기존 동작). */
    #detail_frame {
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
    }

    /* ── 별도창 전용 공통 타이틀바 — 임베드(미리보기)에선 숨김, win 모드에서만 표시 ── */
    #dtlTitlebar {
        display: none;
    }
    html[data-u4a-win="X"] body {
        display: flex;
        flex-direction: column;
        background: var(--boot-bg, var(--app-bg));
    }
    html[data-u4a-win="X"] #dtlTitlebar {
        display: flex;
    }
    /* 별도창: 타이틀바 아래 나머지 전부 */
    html[data-u4a-win="X"] #detail_frame {
        height: auto;
        flex: 1 1 auto;
        min-height: 0;
    }
</style>

<body>

    <!-- 별도창 전용 공통 타이틀바(frameless) — minimize 제외: 로고/제목/최대화/닫기. 임베드 미리보기에선 CSS로 숨김. -->
    <header class="u4a-titlebar" id="dtlTitlebar">
        <img class="u4a-titlebar__logo" id="dtlLogo" src="" alt="U4A">
        <span class="u4a-titlebar__title" id="dtlTitle"></span>
        <div class="u4a-titlebar__spacer"></div>
        <button type="button" class="u4a-winbtn" id="dtlWinMax" title="Maximize"><i class="fa-solid fa-window-maximize"></i></button>
        <button type="button" class="u4a-winbtn u4a-winbtn--close" id="dtlWinClose" data-action="close" title="Close"><i class="fa-solid fa-xmark"></i></button>
    </header>

    <div id="mm"></div>

    <iframe id="detail_frame" name="detail_frame" allowfullscreen></iframe>


    <script>

        var IF_DATA = undefined;

        /*******************************************************
         * @function - 기 저장된 선택 정보 기준으로 선택 표시 재설정
         *******************************************************/
        function _setSelectionRefresh(){

            let oIframe = document.getElementById("detail_frame");
            if(oIframe.src == ""){
                return;
            }

            let oContWin = oIframe.contentWindow;
            if(!oContWin){
                return;
            }

            if(oContWin?.oAPP?.fn?.setSelectionRefresh){
                oContWin.oAPP.fn.setSelectionRefresh();
            }                   

        } // end of _setSelectionRefresh

        /*******************************************************
         * @function - 테마 변경하기
         *******************************************************/
        function _setThemeChange(oBrodData){

            let sTheme = oBrodData.THEME;

            let oIframe = document.getElementById("detail_frame");
            if(oIframe.src == ""){
                return;
            }

            let oContWin = oIframe.contentWindow;
            if(!oContWin || !oContWin.sap){
                return;
            }
            
            oContWin.sap.ui.getCore().applyTheme(sTheme);

        } // end of _setThemeChange


        document.addEventListener('DOMContentLoaded', function () { 
        
            var oURL = new URL(location.href);
            var oSrchParam = oURL.searchParams;

            // 브로드캐스트 channal Id
            let sChennalId = oSrchParam.get('browskey') + oSrchParam.get('mid');
            
            // 브로드캐스트 객체 생성
            window.broadcast = new BroadcastChannel(sChennalId);
            
            // 브로드캐스트 메시지 수신
            window.broadcast.onmessage = function(e){
                
                let oBrodData = e.data;

                if(oBrodData?.PRCCD){

                    switch(oBrodData?.PRCCD){

                        // 기 저장된 선택 정보 기준으로 선택 표시 재설정
                        case "SEL_REF":
                            
                            _setSelectionRefresh();                            

                            break;
                            
                        // 테마 변경
                        case "THEME_CHANGE": 

                            _setThemeChange(oBrodData);

                            break;

                    }

                    return;
                }

                /*********************************************************************
                 * 디테일 영역의 iframe에 로드 후 새창을 열면 broadcast가 둘다 수신되는데
                 * 디테일 영역의 iframe은 이미 화면이 로드된 상태에서 또 수신받으면
                 * 화면을 갱신하는 현상으로 iframe의 src가 없을 때에만 src를 지정함.
                 *********************************************************************/
                
                let oIframe = document.getElementById("detail_frame");
                if(oIframe.src !== ""){
                    return;
                }
                
                IF_DATA = oBrodData;

                oIframe.src = "index.html";                

            };
        
        });        
    
        window.onbeforeunload = function(){

            // 브로드캐스트 객체가 있으면 종료 후 삭제한다.
            if(window.broadcast){
                window.broadcast.close();
                delete window.broadcast;
            }

        };

    </script>
    
</body>

</html>
