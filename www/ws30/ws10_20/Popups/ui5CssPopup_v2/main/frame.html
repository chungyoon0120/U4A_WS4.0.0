<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta charset="utf-8">

    <!-- ===== 공통 헤더(.u4a-titlebar)·버튼·토큰 (iconPrevPopup·illustMsgPopup 동일 스택) =====
         원본: ui5CssPopup_v2 별도창 — 네이티브 OS 창틀 사용.
         HTML5: 창 크롬만 [공통 .u4a-titlebar] 로 외부화(frameless). 본문(UI5 Predefined CSS Helper)은
                서버 UI5 를 부트스트랩하는 iframe(index.html) = KEEP-UI5(index.js/views 그대로).
         경로: Popups/ui5CssPopup_v2/main 기준 → theme=../../../theme, lib=../../../../../lib. (browser-window-common-ux) -->
    <link rel="stylesheet" href="../../../theme/tokens.css">
    <link rel="stylesheet" href="../../../theme/shell.css">
    <link rel="stylesheet" href="../../../theme/bootstrap-skin.css">
    <link rel="stylesheet" href="../../../../../lib/fontawesome/7.2.0/css/all.min.css">

    <script src="../../../theme/theme-api.js"></script>
    <script src="../../../theme/u4a-ui.js"></script>

    <!-- [흰색 플래시 방지 — 동기] opener 가 넘긴 BGCOL/THEME/TITLE 을 첫 페인트 전에 적용 -->
    <script>
        (function () {
            try {
                var q = new URLSearchParams(location.search);
                var sBg = q.get("BGCOL");
                if (sBg) { document.documentElement.style.setProperty("--boot-bg", sBg); }
                var sTheme = q.get("THEME");
                if (sTheme && window.U4ATheme) {
                    window.U4ATheme.apply(window.U4ATheme.normalize ? window.U4ATheme.normalize(sTheme) : sTheme);
                }
                var sTitle = q.get("TITLE");
                if (sTitle) { document.title = sTitle; }
            } catch (e) { /* frame.js 에서 재적용 */ }
        })();
    </script>

    <style>
        html, body { margin: 0; height: 100%; }
        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--boot-bg, var(--app-bg));
        }
        /* 본문 = 서버 UI5(index.html) iframe (타이틀바 아래 나머지 전부) */
        #ws_frame {
            flex: 1 1 auto;
            width: 100%;
            min-height: 0;
            border: 0;
            display: block;
            /* [흰 플래시 방지] src 로드 전/중 흰 캔버스 차단 — 요소 배경을 테마색으로. */
            background: var(--boot-bg, var(--app-bg));
        }
    </style>
</head>

<body>

    <!-- ===== 공통 커스텀 헤더(frameless) — 로고/제목/min·max·close (iconPrevPopup 동일) ===== -->
    <header class="u4a-titlebar" id="ui5cssTitlebar">
        <img class="u4a-titlebar__logo" id="ui5cssLogo" src="" alt="U4A">
        <span class="u4a-titlebar__title" id="ui5cssTitle"></span>
        <div class="u4a-titlebar__spacer"></div>
        <button type="button" class="u4a-winbtn" id="ui5cssWinMin" title="Minimize"><i class="fa-solid fa-window-minimize"></i></button>
        <button type="button" class="u4a-winbtn" id="ui5cssWinMax" title="Maximize"><i class="fa-solid fa-window-maximize"></i></button>
        <button type="button" class="u4a-winbtn u4a-winbtn--close" id="ui5cssWinClose" data-action="close" title="Close"><i class="fa-solid fa-xmark"></i></button>
    </header>

    <!-- 본문 = 서버 UI5(index.html) 를 로드하는 iframe. 콘텐츠=KEEP-UI5(index.js/views). frame.js 가 src 설정 -->
    <iframe id="ws_frame" name="ws_frame" src="" frameborder="0" allowfullscreen></iframe>

    <!-- Busy 오버레이 — ★공통 .u4a-busy★(shell.css 단일 출처). 초기 서버 UI5 로드 중 표시,
         UI5 렌더 완료(index.js onAfterRendering → parent.fnFinishOpen) 시 해제. -->
    <div id="ui5cssBusy" class="u4a-busy" data-busy="true" role="progressbar" aria-valuetext="Busy">
        <div class="u4a-busy__card">
            <div class="u4a-busy__spinner"></div>
        </div>
    </div>

    <script src="frame.js"></script>

</body>

</html>
