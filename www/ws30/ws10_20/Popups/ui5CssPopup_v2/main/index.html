<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

    <!-- [흰 플래시 방지] UI5 콘텐츠라 테마 인프라가 없어 로드 전 흰색. 부모(frame.html)의 --boot-bg 를
         첫 페인트 전 문서 배경으로 상속(동일 origin). UI5 렌더 완료되면 UI5 배경이 덮는다. -->
    <script>
        (function () {
            try {
                var bg = parent.document.documentElement.style.getPropertyValue("--boot-bg");
                if (bg) {
                    var s = document.createElement("style");
                    s.textContent = "html,body{background:" + bg + ";}";
                    document.head.appendChild(s);
                }
            } catch (e) { }
        })();
    </script>

    <style>
        .sapUiBlockLayer, .sapUiLocalBusyIndicator {
            background-color: transparent !important;   
        }

        .sapUiLocalBusyIndicator:focus:after {
            border: 0px !important;
        }

        .u4aWsCssPage .sapUiFixFlexFlexibleContainer {
            overflow-y: auto;
        }
        
        .u4aWsCssPage .sapUiUfdSpltContCntnt {
            overflow-y: hidden;
        }

        .u4aWsCssPage .NoDataPage .sapMIllustration.sapMFlexItem {
            height: 50%;
            width: 50%;
        }
    </style>
</head>


<body class="sapUiBody">

    <div id="Content"></div>

    <script src="index.js"></script>
    
</body>

</html>
