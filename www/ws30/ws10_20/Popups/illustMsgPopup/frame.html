<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title></title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .u4aWsBrowserDraggable {
            -webkit-app-region: drag !important;
        }

        .u4aWsBrowserDraggable .sapMBtn,
        .u4aWsBrowserDraggable .sapMSlt {
            -webkit-app-region: no-drag;
        }
    </style>
</head>

<body>

    <div id="content" class="won_content" style="opacity: 0;"></div>

    <script>

        let oAPP = {};

        oAPP = parent.gfn_parent();

        const
            require = oAPP.require,
            REMOTE = oAPP.remote,
            APP = oAPP.remote.app,
            PATH = oAPP.remote.require('path'),
            APPPATH = APP.getAppPath(),
            PATHINFOURL = PATH.join(APPPATH, "ws30", "resources", "pathInfo.js"),
            PATHINFO = require(PATHINFOURL),
            WSERR = require(PATHINFO.WSTRYCATCH),
            zconsole = WSERR(window, document, console),
            WSUTIL = require(PATHINFO.WSUTIL),
            CURRWIN = REMOTE.getCurrentWindow(),
            PARWIN = CURRWIN.getParentWindow();

        var oScript = document.createElement("script");
        oScript.id = "sap-ui-bootstrap";

        // ★ UI5 부트 소스 = 원본 그대로 UI5LIB_WSSRC(=resourceUrl).
        //   dev(APP.isPackaged=false)에서는 resourceUrl=testResource(원격 UI5 CDN, sap-ui-core.js)라 검증된 URL.
        //   ※ 한때 UI5LIB_SSRC(sServerHost+LIBPATH)로 바꿨더니 sap 이 안 떠서 frame.js 크래시 → 바깥 프레임까지
        //     백지가 됐음(200 오응답이면 onerror 도 안 떠 오류 다이얼로그도 없음). 원본 설계=frame.js:WSSRC /
        //     selectSAP:SSRC 분리 로 원복. (selectSAP.html 은 원본대로 SSRC 유지 = KEEP-UI5)
        oScript.setAttribute("src", oAPP.UI5LIB_WSSRC);
        oScript.setAttribute('data-sap-ui-theme', oAPP.UI5_THEME);
        oScript.setAttribute("data-sap-ui-language", oAPP.UI5_LANGU);
        oScript.setAttribute("data-sap-ui-preload", "async");
        oScript.setAttribute("data-sap-ui-noduplicateids", "true");
        oScript.setAttribute("data-sap-ui-libs", "sap.m, sap.ui.core, sap.f, sap.ui.table");

        // UI5 로드 실패(통신/경로/서버다운) 즉시 감지 → 셸(index.js)의 공통 오류 안내 후 창 닫기(안전망).
        //   oAPP === parent.gfn_parent() 라 셸의 _onUi5LoadFail 을 직접 호출.
        oScript.onerror = function () {
            try { oAPP.fn && oAPP.fn._onUi5LoadFail && oAPP.fn._onUi5LoadFail("ui5-script-error(WSSRC)"); } catch (e) { }
        };

        document.head.appendChild(oScript);

        window.onload = () => {

            // ★ sap 미생성 방어(case 2): 부트 <script> 가 로드는 됐으나(200 오응답/부분로드 등) 실제 UI5(sap)가
            //   없으면, frame.js 가 sap.ui... 접근 시 ReferenceError → ws_trycatch 크리티컬(APP.exit, 앱 전체 종료).
            //   그 전에 공통 오류 안내 후 창(뷰어)만 닫도록 선제 처리(아이콘 목록 onFrameLoadSuccess 의 sap 체크와 동일 취지).
            //   실체크(타임아웃 추측 아님)라 [[no-timeout-busy-fallback]] 위배 아님.
            if (typeof sap === "undefined" || !sap.ui || !sap.ui.getCore) {
                try { oAPP.fn && oAPP.fn._onUi5LoadFail && oAPP.fn._onUi5LoadFail("no-sap-after-onload(WSSRC)"); } catch (e) { }
                return;
            }

            let LV_UI5JS = document.createElement("script");

            LV_UI5JS.setAttribute('src', 'JS/frame.js');

            document.body.append(LV_UI5JS);

        };

        function gfn_parent() {

            return oAPP;

        };

    </script>

</body>

</html>
