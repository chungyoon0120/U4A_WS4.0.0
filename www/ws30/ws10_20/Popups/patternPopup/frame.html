<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

    <!-- ===== 공통 헤더(.u4a-titlebar)·버튼·트리·스플리터·패널·토큰 (errorPageEditorFrame 과 동일 짝) ===== -->
    <link rel="stylesheet" href="../../theme/tokens.css">
    <link rel="stylesheet" href="../../theme/shell.css">
    <link rel="stylesheet" href="../../theme/bootstrap-skin.css">
    <link rel="stylesheet" href="../../../../lib/fontawesome/7.2.0/css/all.min.css">
    <link rel="stylesheet" href="frame.css">

    <script src="../../theme/theme-api.js"></script>
    <script src="../../theme/u4a-ui.js"></script>

    <!-- [흰색 플래시 방지 — 동기] opener 가 넘긴 THEME/BGCOL/TITLE 을 첫 페인트 전에 적용 -->
    <script>
        (function () {
            try {
                var q = new URLSearchParams(location.search);
                var sBg = q.get("BGCOL");
                if (sBg) { document.documentElement.style.setProperty("--boot-bg", sBg); }
                var sTheme = q.get("THEME");
                if (sTheme && window.U4ATheme) {
                    window.U4ATheme.apply(window.U4ATheme.normalize ? window.U4ATheme.normalize(sTheme) : sTheme);
                }
                var sTitle = q.get("TITLE");
                if (sTitle) { document.title = sTitle; }
            } catch (e) { /* frame.js 에서 재적용 */ }
        })();
    </script>
</head>

<body>

    <!-- ===== 공통 커스텀 헤더(frameless) — 로고/제목/닫기 ===== -->
    <header class="u4a-titlebar" id="pattTitlebar">
        <img class="u4a-titlebar__logo" id="pattLogo" src="" alt="U4A">
        <span class="u4a-titlebar__title" id="pattTitle"></span>
        <span class="u4a-titlebar__spacer"></span>
        <button class="u4a-winbtn u4a-winbtn--close" data-action="close" title="Close"><i class="fa-solid fa-xmark"></i></button>
    </header>

    <!-- ===== 본체 = [좌: 기본/커스텀 트리 세로분할] | [우: 코드 뷰어] ===== -->
    <div class="u4aPattBody" id="pattBody">
        <div class="u4a-splitter" id="pattOuterSplit">

            <!-- 좌측(트리 영역) — 내부에 세로 스플릿(기본 | 커스텀) -->
            <div class="u4a-splitter__pane u4aPattLeft">
                <div class="u4a-splitter u4aPattVert" id="pattVertSplit">

                    <!-- 기본 패턴 트리(읽기전용) — 컬럼헤더[기본 패턴] + tree.el 은 frame.js 가 채운다 -->
                    <div class="u4a-splitter__pane u4aPattTreePane u4aPattTreePane--def">
                        <div class="u4aPattTreeBody" id="pattDefBody"></div>
                    </div>

                    <div class="u4a-splitter__bar u4aPattVBar" role="separator" aria-orientation="horizontal"></div>

                    <!-- 커스텀 패턴 트리 — 툴바[Create] + 컬럼헤더[커스텀 패턴 | Content Type] + tree.el -->
                    <div class="u4a-splitter__pane u4aPattTreePane u4aPattTreePane--cust">
                        <div class="u4aPattTreeTool">
                            <span class="u4aPattTreeTool__spacer"></span>
                            <button type="button" class="u4a-btn u4a-btn--emphasized u4aPattCreateBtn" id="pattCustCreateBtn">
                                <i class="fa-solid fa-plus"></i><span></span>
                            </button>
                        </div>
                        <div class="u4aPattTreeBody" id="pattCustBody"></div>
                    </div>

                </div>
            </div>

            <div class="u4a-splitter__bar" role="separator" aria-orientation="vertical"></div>

            <!-- 우측(코드 뷰어) — 선택 패턴 코드(읽기전용 Monaco) + 제목 + 복사 / 빈 상태 -->
            <div class="u4a-splitter__pane u4aPattRight">
                <div class="u4aPattViewHead" id="pattViewHead" hidden>
                    <span class="u4aPattViewTitle" id="pattViewTitle"></span>
                    <!-- 코드 뷰어 줌 [−][🔍%][+] — 뷰어 Monaco(호스트) 폰트 줌 따라감(공통 fontZoom*·evt:zoom). 다이얼로그 푸터 줌과 동일 룩. -->
                    <div class="u4aPattViewZoom" id="pattViewZoom">
                        <button type="button" class="u4a-btn u4aPattViewZoomBtn u4aPattViewZoomStep" id="pattViewZoomOut" title="Ctrl + Wheel ↓"><i class="fa-solid fa-minus"></i></button>
                        <button type="button" class="u4a-btn u4aPattViewZoomBtn u4aPattViewZoomPct" id="pattViewZoomBtn"><i class="fa-solid fa-magnifying-glass"></i><span>100%</span></button>
                        <button type="button" class="u4a-btn u4aPattViewZoomBtn u4aPattViewZoomStep" id="pattViewZoomIn" title="Ctrl + Wheel ↑"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <button type="button" class="u4a-btn u4aPattCopyBtn" id="pattCopyBtn">
                        <i class="fa-solid fa-copy"></i>
                    </button>
                </div>
                <!-- 두 서브페이지(빈상태 / 코드 뷰어) 전환 = §9 슬라이드+페이드(0.26s±32px). Monaco 는 1회 로드 후 setValue 만. -->
                <div class="u4aPattViewBody">
                    <!-- 빈 상태(원본 IllustratedMessage) -->
                    <div class="u4aPattEmpty u4aPattPage" id="pattEmpty">
                        <i class="fa-regular fa-rectangle-list u4aPattEmpty__icon"></i>
                        <div class="u4aPattEmpty__title" id="pattEmptyTitle"></div>
                        <div class="u4aPattEmpty__desc" id="pattEmptyDesc"></div>
                    </div>
                    <!-- 코드 뷰어 = 공통 Monaco 호스트(editorPopup/host 재사용) iframe. 초기 숨김. -->
                    <div class="u4aPattHostWrap u4aPattPage u4aPattPageHidden" id="pattHostWrap">
                        <iframe id="pattHost" name="pattHost" frameborder="0"></iframe>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- 로딩 오버레이 = 공통 busy(.u4a-busy, shell.css SSOT). 토스트는 공통 .u4a-toast 를 frame.js 가 동적 생성. -->
    <div class="u4a-busy" id="pattBusy">
        <div class="u4a-busy__card">
            <div class="u4a-busy__spinner"></div>
            <div class="u4a-busy__label"></div>
        </div>
    </div>

    <script src="frame.js"></script>

</body>

</html>
