<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- ===== CSS 리소스 스택 ===== -->
    <link rel="stylesheet" href="../../../../lib/fontawesome/7.2.0/css/all.min.css">
    <link rel="stylesheet" href="../../../../lib/bootstrap/5.0.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../theme/tokens.css">
    <link rel="stylesheet" href="../../theme/shell.css">
    <link rel="stylesheet" href="../../theme/bootstrap-bridge.css">
    <link rel="stylesheet" href="../../theme/bootstrap-skin.css">
    <link rel="stylesheet" href="css/index.css">

    <!-- ===== JS 리소스 스택 (동기) ===== -->
    <script src="../../theme/theme-api.js"></script>
    <script src="../../theme/u4a-ui.js"></script>

    <!-- [흰색 플래시 방지 — 동기] opener 가 넘긴 BGCOL/THEME/TITLE 을 첫 페인트 전에 적용 -->
    <script>
        (function () {
            try {
                var q = new URLSearchParams(location.search);
                var sBg = q.get("BGCOL");
                if (sBg) { document.documentElement.style.setProperty("--boot-bg", sBg); }
                var sTheme = q.get("THEME");
                if (sTheme && window.U4ATheme) {
                    window.U4ATheme.apply(window.U4ATheme.normalize ? window.U4ATheme.normalize(sTheme) : sTheme);
                }
                var sTitle = q.get("TITLE");
                if (sTitle) { document.title = sTitle; }
            } catch (e) { }
        })();
    </script>
</head>

<body class="u4aShortcutBody">

    <!-- ===== frameless 타이틀바 (공통 .u4a-titlebar 표준 높이 소비) ===== -->
    <header class="u4a-titlebar" id="u4aShortcutTitlebar">
        <img class="u4a-titlebar__logo" id="u4aShortcutLogo" src="" alt="U4A">
        <span class="u4a-titlebar__title" id="u4aShortcutTitle"></span>
        <div class="u4a-titlebar__spacer"></div>
        <button type="button" class="u4a-winbtn" id="u4aShortcutWinMax" data-action="max" title="Maximize" aria-label="Maximize"><i class="fa-solid fa-window-maximize"></i></button>
        <button type="button" class="u4a-winbtn u4a-winbtn--close" id="u4aShortcutWinClose" data-action="close" title="Close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    </header>

    <!-- ===== 메인 스크롤 콘텐츠 영역 ===== -->
    <main class="u4aShortcutMain u4a-scroll">
        <div class="u4aShortcutContent container-fluid">
            <!-- 1. General Information Panel -->
            <div id="generalInfoPanel"></div>

            <!-- 2. Target Host URL Panel -->
            <div id="targetHostPanel"></div>

            <!-- 3. Browser Type Panel -->
            <div id="browserTypePanel"></div>

            <!-- 4. Browser Option Panel (Chrome/Edge) -->
            <div id="browserOptionPanel"></div>

            <!-- 5. Additional Parameter Panel (Table) -->
            <div id="paramPanel"></div>
        </div>
    </main>

    <!-- ===== 하단 푸터 (높이 48px 표준) ===== -->
    <footer class="u4aShortcutFooter">
        <div id="u4aFooterMessage"></div>
        <div class="u4aShortcutFooter__buttons">
            <button type="button" class="u4a-btn u4a-btn--emphasized" id="btnSave"><i class="fa-solid fa-floppy-disk"></i> <span id="btnSaveText"></span></button>
            <button type="button" class="u4a-btn u4a-btn--negative" id="btnCancel"><i class="fa-solid fa-xmark"></i> <span id="btnCancelText"></span></button>
        </div>
    </footer>

    <!-- ===== Top-layer Busy 로딩 오버레이 (dialog 태그 사용) ===== -->
    <dialog class="u4a-busy" id="u4aShortcutBusy" role="progressbar" aria-valuetext="Busy">
        <div class="u4a-busy__card">
            <div class="u4a-busy__spinner"></div>
            <div class="u4a-busy__label" id="u4aBusyLabel">Loading...</div>
        </div>
    </dialog>

    <!-- ===== JS 리소스 스택 (끝) ===== -->
    <script src="../../../../lib/bootstrap/5.0.2/js/bootstrap.bundle.min.js"></script>
    <script src="js/index.js"></script>
    <script src="../../js/fnAppF4PopupOpen.js"></script>

</body>

</html>
