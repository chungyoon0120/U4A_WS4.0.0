<title>busy check</title>
<!-- www/ws30/ws10_20/theme/u4a-busy.css + u4a-busy.js 를 그대로 인라인한 확인용 페이지. -->
<!-- 고칠 것은 그 두 파일을 고치고 이 페이지를 다시 만든다. 여기서 직접 고치지 않는다. -->
<style>
/************************************************************************
 * U4A Workspace — 테마 토큰 (doc 12 §4.1 / §4.2)
 * ----------------------------------------------------------------------
 * Layer 1: Primitive  — sap_horizon 중립 팔레트 + 강조색 램프
 * Layer 2: Semantic   — 컴포넌트는 이 토큰만 소비 (:root = white 기본)
 * Layer 3: 테마        — themes/*.css 에서 색 토큰만 override
 *
 * ⚠ 중립색 값은 doc 12 §4.1 harvest 기준 초기값(제안)이다.
 *   실제 sap_horizon / sap_horizon_dark 파라미터 덤프로 추후 교체 가능.
 *   shape(radius/elevation/font)는 horizon 공통 고정.
 ************************************************************************/

/* ── Layer 1: Primitive ─────────────────────────────────────────── */
:root {
    /* horizon neutrals (light) */
    --c-white: #ffffff;
    --c-bg-light: #f5f6f7;
    --c-text: #1d2d3e;
    --c-text-muted: #556b82;
    --c-line: #d9d9d9;

    /* horizon neutrals (dark) */
    --c-bg-dark: #12171c;
    --c-surface-dark: #1c2228;
    --c-text-dark: #eaecee;
    --c-line-dark: #2c3540;

    /* accent ramps */
    --c-blue: #0070f2;
    --c-blue-strong: #0064d9;
    --c-purple: #7858ff;
    --c-purple-strong: #5d36ff;
    --c-red: #e8000d;
    --c-red-strong: #c60017;
    --c-green: #188918;
    --c-green-strong: #0e6b0e;

    /* horizon 상태색 (테마 공통) */
    --c-success: #107e3e;
    --c-success-strong: #0d6b35;   /* 성공 초록의 진한 짝(파랑 --c-blue/--c-blue-strong 과 대칭) — Accept 버튼 마우스 올림용. */
    --c-warning: #e76500;
    --c-error: #e90b0b;
}

/* ── Layer 2: Semantic (:root = white 기본) ─────────────────────── */
:root {
    /* 네이티브 컨트롤(체크박스/라디오/스크롤바 등)을 테마 모드에 맞춰 렌더 */
    color-scheme: light;

    /* color */
    --app-bg: var(--c-bg-light);
    --surface: var(--c-white);
    --surface-raised: var(--c-white);
    --text: var(--c-text);
    --text-muted: var(--c-text-muted);
    --line: var(--c-line);
    --divider: var(--line);
    --accent: var(--c-blue);
    --accent-strong: var(--c-blue-strong);
    --success: var(--c-success);
    --warning: var(--c-warning);
    --error: var(--c-error);

    /* interaction states (체크리스트 B) */
    --hover-bg: rgba(85, 107, 130, .08);
    --active-bg: rgba(85, 107, 130, .16);
    --selected-bg: rgba(0, 112, 242, .18);
    --selected-text: var(--accent);
    --focus-ring: var(--accent);
    --disabled-bg: #f5f6f7;
    --disabled-text: #a9b4be;
    --disabled-opacity: .4;
    --switch-off: #c4ccd4;

    /* value states — UI5 ValueState (체크리스트 B/F) */
    --state-error: var(--c-error);
    --state-error-bg: #ffeaea;
    --state-warning: var(--c-warning);
    --state-warning-bg: #fff8e5;
    --state-success: var(--c-success);
    --state-success-strong: var(--c-success-strong);   /* Accept(성공) 채운 버튼 마우스 올림 — 파랑 --accent-strong 과 대칭. */
    --state-success-bg: #eafaf0;
    --state-info: var(--accent);
    --state-info-bg: #e8f1ff;

    /* scrollbar (체크리스트 A) */
    --scrollbar-thumb: #c4ccd4;
    --scrollbar-thumb-hover: #a9b4be;
    --scrollbar-track: transparent;
    --scrollbar-size: 0.75rem;

    /* overlay / popup (체크리스트 C) */
    --overlay-scrim: rgba(0, 0, 0, .45);
    /* busy 베일 — 검정 스크림 대신 밝은 톤(깜빡임/눈부심 완화) */
    --busy-scrim: rgba(245, 246, 247, .6);
    --popover-bg: var(--c-white);
    --popover-shadow: 0 0.5rem 2rem rgba(34, 54, 84, .20);

    /* form / text 표면 (체크리스트 A/F) */
    --placeholder: #8b97a3;
    --selection-bg: rgba(0, 112, 242, .20);
    --caret: var(--accent);

    /* link / icon (체크리스트 G) */
    --link: var(--accent);
    --link-hover: var(--accent-strong);
    --icon: currentColor;
    /* 아이콘색 = 본문색(--text). 회색(muted)은 disable 처럼 보인다는 피드백 →
       활성 아이콘은 본문과 같은 또렷한 색으로. (실제 disabled 는 별도 --disabled-text 가 덮음) */
    --icon-muted: var(--text);
    /* 트리 폴더 아이콘(앰버) — 서버리스트 기준을 공통 표준으로 승격(2026-07-02). 테마별 override 가능. */
    --folder-icon: #e6a93a;

    /* titlebar / desktop (체크리스트 H) */
    --titlebar-bg: var(--surface);
    /* 비활성(blur) 타이틀바 위에 덮는 고정 베일 — 타이틀바에 opacity 를 주면 반투명이 되어
       "뒤 배경"이 비치는데 그 배경이 창마다 달라(Main=본문 --app-bg / Login 호스트 프레임 등)
       같은 비활성인데도 헤더색이 달라진다. 불투명 배경 위에 이 베일을 덮어 어느 창에서나 동일한
       흐림으로 통일한다. 중립 회색(저채도화) — 라이트/다크 공통. */
    --titlebar-blur-veil: rgba(130, 130, 138, 0.34);
    --close-hover-bg: var(--c-red);
    --close-hover-text: var(--c-white);

    /* shape — horizon 공통(테마 무관 고정) */
    --radius: 0.5rem;
    --radius-sm: 0.25rem;
    --elevation: 0 0.125rem 0.5rem rgba(34, 54, 84, .10);
    --focus-ring-width: 0.125rem;
    --focus-ring-offset: 0.0625rem;
    --font: "72", "72full", Arial, Helvetica, sans-serif;
    --motion: .15s;
}

/* prefers-reduced-motion 시 트랜지션 끔 (체크리스트 I) */
@media (prefers-reduced-motion: reduce) {
    :root {
        --motion: 0s;
    }
}

html, body { height: 100%; margin: 0; background: var(--surface); color: var(--text); font: 13px system-ui; }
.bar { position: fixed; left: 12px; top: 12px; z-index: 2; }
.hint { position: fixed; left: 12px; top: 48px; z-index: 2; color: var(--text-muted); line-height: 1.8; }
.hint b { color: var(--text); }
button { padding: 6px 10px; margin-right: 6px; }
/************************************************************************
 * U4A Workspace — 공통 busy CSS (u4a-busy.js 의 짝)
 * ----------------------------------------------------------------------
 * [2026-09-15, 장군님 지시] busy 도 하나의 UI — 공통 화면 리소스(theme/) 전용 파일로 옮기고,
 *   화면 시작 때 가장 먼저 로드한다(ws10_20/index.html <head> 맨 앞).
 *   옮겨온 곳 = ws10_20/css/frame.css (규칙·순서·값을 그대로 옮겼다 — 모양 변화 없음).
 *
 * ★ 다른 화면에 영향 주지 않는 규칙 (반드시 지킬 것)
 *   · 선택자는 전부 busy 전용 이름(u4aWsBusy* · u4aWsSpinner)으로만 시작한다.
 *     `*` · html · body · 맨 dialog · :root 규칙을 넣지 않는다. 색 변수는 쓰기만 하고 정의하지 않는다.
 *   · 애니메이션 이름도 busy 전용(u4aWs*). shell.css 의 .u4a-busy(서버리스트·별창용)와 이름이 다르다.
 *   · 이 파일을 맨 앞에 로드해도 되는 이유: var(--*) 는 CSS 파일 순서와 상관없이 그릴 때 값을 찾고,
 *     뒤에 로드되는 CSS 중 busy 이름을 쓰는 것이 없다(2026-09-15 확인).
 ************************************************************************/

/* BusyIndicator */
#u4aWsBusyIndicator {
    right: 0;
}

.u4aWsBusyIndicator {
    z-index: 2000000;

    /* 로고 보라 — 시안이 정한 값(WS 로고 색). 이 두 줄이 유일한 출처다.
       ★[2026-10-30] 종전에는 .u4aWsBusyCard 에 있었다. 그러면 **카드 밖**에 있는
         화면 테두리 띠(.u4aWsBusyAura)가 이 값을 못 받아 **색 없이 투명하게 그려진다**
         (장군님 화면에서 띠가 아예 안 보였다 — CSS 변수는 부모에게서만 내려온다).
         카드는 여기서 상속받으므로 종전과 똑같이 보인다. */
    --busy-accent: #c705f7;
    --busy-accent-2: #ff7af5;
}

/* ===== Busy Indicator (구 sap.m.BusyDialog 대체 — 스크림 + 테마 카드) =====
   setBusy/setDomBusy 가 display 토글. setBusy("X",{TITLE,DESC}) → 카드에 메시지 표시. */
.u4aWsBusyIndicator {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;           /* setDomBusy 가 'flex' 로 토글 */
    align-items: center;
    justify-content: center;
    /* 스크림(어두운 배경) 제거 — 빠른 busy on/off 시 배경 깜빡임 방지.
       투명이어도 전체를 덮는 오버레이라 busy 동안 클릭은 그대로 차단됨. */
    background: transparent;
    z-index: 9999;
}

/* busy 요소가 <dialog> 일 때 — U4ABusy.show() 가 showModal() 로 띄워
   모달 팝업 위(top-layer)에도 보이게 한다. 전체화면 투명 + 카드 중앙 + 무스크림 backdrop. */
dialog.u4aWsBusyIndicator {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    max-width: none;
    max-height: none;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    overflow: hidden;
}
dialog.u4aWsBusyIndicator:not([open]) { display: none; }
dialog.u4aWsBusyIndicator[open] {
    display: flex;
    align-items: center;
    justify-content: center;
}
dialog.u4aWsBusyIndicator::backdrop { background: transparent; }

/************************************************************************
 * 중앙 카드 = Sparkle (장군님 결정 2026-10-29)
 * ----------------------------------------------------------------------
 * 「멋있는 로그인 페이지」 세션의 시안 6안 05 Sparkle 을 그대로 옮겼다.
 *   지침서 = D:/workspace/yoon-history-test/test2/handoff/ws4-busy-sparkle/GUIDE.md
 *   은은하게 켜진 WS 로고 위로 금속 광택 빛줄기가 비스듬히 지나가고,
 *   빛이 지나는 자리마다 작은 별빛이 튄다. 카드 테두리는 빛이 한 바퀴 돈다.
 *
 * ★테마 — 켜고 끄는 로직은 한 줄도 바꾸지 않았다. 모양만 바꿨다.
 *   · 카드 배경·테두리·그림자·글자색은 **종전처럼 테마 의미 토큰**을 쓴다
 *     → 테마 11종 전부 저절로 맞는다(테마별 하드코딩 없음).
 *   · 다크/화이트는 `html[data-sl-theme="dark"]` 하나로 가른다(theme-api.js 의 _applySkin 이 붙인다).
 *     기본(선택자 없음) = 밝은 테마 — 테마 11종 중 10종이 밝은 테마이고 기본값도 horizon_white 다.
 *   · 테마를 바꾸면 그 속성이 바로 바뀌므로 **busy 가 떠 있는 중에도 바로 따라 바뀐다**(JS 없음).
 ************************************************************************/

.u4aWsBusyCard {
    /* 밝은 테마 기준값 — 흰 바탕에서 사라지는 흰 빛은 보조 색으로, 번지는 빛은 옅게.
       ★--busy-dim 은 시안의 72% 가 아니라 **진하게**(100%) 쓴다 — 흰 카드 위에서 72% 로 깔면
         로고가 연분홍으로 바래 「또렷이 보인다」는 기준(지침서 3-2)을 못 맞춘다(2026-10-29 실측). */
    --busy-hi: var(--busy-accent-2);
    --busy-glow: color-mix(in srgb, var(--busy-accent) 25%, transparent);
    --busy-dim: var(--busy-accent);
    --busy-sweep-hi: #ffffff;

    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    min-width: 300px;
    max-width: 440px;
    padding: 28px 34px 24px;
    overflow: hidden;
    background: var(--popover-bg, var(--surface-raised, var(--surface)));
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--popover-shadow, var(--elevation, 0 14px 44px rgba(0, 0, 0, 0.45)));
    animation: u4aWsBusyCardIn 0.22s cubic-bezier(0.22, 0.61, 0.36, 1) both;
}

/* 어두운 테마 — 별빛은 흰색으로, 번지는 빛은 진하게, 로고 바탕은 옅게. */
html[data-sl-theme="dark"] .u4aWsBusyCard {
    --busy-hi: #ffffff;
    --busy-glow: color-mix(in srgb, var(--busy-accent) 60%, transparent);
    --busy-dim: color-mix(in srgb, var(--busy-accent) 45%, transparent);
}

@keyframes u4aWsBusyCardIn {
    from { opacity: 0; transform: translateY(10px) scale(0.94); }
    to   { opacity: 1; transform: none; }
}

/* 카드 테두리 전체를 따라 한 바퀴씩 도는 빛.
   ★[2026-10-30] 각도 값(@property) 애니메이션을 **transform rotate** 로 바꿨다.
     까닭: 각도 값 애니메이션은 매 프레임 main thread 가 다시 그린다 — 무거운 동기 작업이
     main thread 를 붙잡으면 빛이 멈춘다(장군님 「busy 키는건 좋은데 왜 애니메이션이 무거운
     프로그램 돌때 끈키냐」). transform 은 compositor 에서 돌아 멈추지 않는다.
     실측(헤드리스 크롬, 3초 붙잡는 동안 첫·끝 프레임 차이) = 각도 7px → transform 1,413px. */
.u4aWsBusyEdge {
    position: absolute;
    inset: 0;

    /* 두께는 정수 px 로 — 1.5px 이면 카드가 반 픽셀 자리에 놓일 때 좌우만 1px 로 얇아 보인다
       (장군님 2026-10-29 「상단 하단은 좋은데 좌측 우측은 얇아 보여」 → 시안에서 3px 확인 후 「딱좋다」). */
    padding: 3px;
    overflow: hidden;
    border-radius: inherit;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
}

/* 카드보다 훨씬 큰 원뿔 판 — 카드 가운데를 축으로 돌면 테두리 위로 빛이 한 바퀴 돈다.
   ★판은 **카드 대각선보다 커야** 한다 — 작으면 모서리에서 빛이 끊긴다.
     지금 카드는 max-width: 440px 이라 640px 로 넉넉하다.
     ★카드를 키우는 것은 아래 zoom 한 줄이고, zoom 은 이 판까지 같은 비율로 키우므로 여기는 안 고친다. */
.u4aWsBusyEdge i {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 640px;
    height: 640px;
    margin: -320px 0 0 -320px;
    background: conic-gradient(transparent 0 62%, var(--busy-accent) 80%, var(--busy-accent-2) 93%, transparent 100%);
    will-change: transform;
    animation: u4aWsBusyEdge 3s linear infinite;
}

@keyframes u4aWsBusyEdge {
    to { transform: rotate(360deg); }
}

/************************************************************************
 * 카드 크기 = zoom 한 줄로 (장군님 지시 2026-10-30)
 * ----------------------------------------------------------------------
 * 「공통 busy도 같이 키워줘라 약 zoom으로 했을때 1.2 정도?」
 * 그 앞 지시 = 「공통 busy는 원래 크기로 원복하고 ai busy만 지금 상태로」
 *   「어짜피 대표 css 클래스로 분기해서 처리하면 변경할 것도 많이 없잖아」
 *
 * ★카드 하나에 zoom 을 걸면 그 안의 **전부**(그림 · 글자 · 여백 · 테두리 빛 두께 · 도는 판)가
 *   같은 비율로 커진다. 그래서 크기를 항목마다 따로 적지 않는다 — 이 두 줄이 전부다.
 *   종전에 따로 적었던 것(카드 폭 · padding · gap · 테두리 두께 · 판 크기 · desc 글자 · 그림 zoom)은
 *   전부 지웠다. 비례가 저절로 맞으므로 모서리에서 빛이 끊기는 일도 없다.
 * ★zoom 은 **겹치지 않는다** — 같은 요소의 같은 속성이라 AI 모드 값이 공통 값을 덮는다.
 * (Electron 45 = Chromium 156 → zoom 이 레이아웃까지 적용된다.)
 ************************************************************************/

/* 공통 busy(서버 통신 그림) */
.u4aWsBusyCard {
    zoom: 1.2;
}

/* AI 전용 busy — 크기는 **공통과 똑같이** 쓴다(장군님 확인 2026-10-30
   「공통 busy가 지금 딱 이쁘게 잘 나오는 사이즈 잖아 busy dialog 크기도 그렇고 그 안에 아이콘도 그렇고」).
   그래서 여기에 zoom 을 따로 두지 않는다 — 위 .u4aWsBusyCard 의 1.2 가 그대로 먹는다.
   ★높이만 따로 준다: AI 그림은 가운데 한 줄(「AI」 — 선 — 로고)이라 공통 그림(높이 60px)보다
     납작해서, 아무것도 안 하면 카드가 공통보다 얇아진다. 120px 은 공통 카드 안쪽 높이와 같다.

 *   → ① 뒤 화면 전체를 흐리게 ② **화면 테두리를 따라 빛줄기가 한 바퀴씩 돈다.**
 * ★처음에 ②를 「가장자리에서 안쪽으로 번지는 빛이 깜빡임」으로 잘못 만들었다가 지적받고 고쳤다.
 *   computer use 는 **테두리를 따라 흐르는 띠**다.
 * ★AI 모드일 때만. 일반 busy 의 배경은 종전대로 투명하고 흐려지지 않는다.
 * ★움직임은 transform 하나뿐이라 무거운 작업 중에도 안 멈춘다.
 * ★backdrop-filter 는 **요소 뒤**만 흐리게 한다 — 자식인 카드는 또렷하게 남는다.

dialog.u4aWsBusyIndicator[data-u4a-busy-mode="ai"] {
    /* ★[2026-10-30 장군님 지시] 「배경이 그리고 너무 투명해」 → 6% → 뒤가 비치되 또렷하게 덮는다. */
    background: color-mix(in srgb, var(--busy-accent) 6%, transparent);
    -webkit-backdrop-filter: blur(1.5px);

/* 짝 마크업 = u4a-busy.js 의 _create(): <span class="u4aWsBusyAura"><i></i></span>
   화면 가장자리에만 빛이 깔리고, 밝기가 숨 쉬듯 오르내린다. 평소에는 숨는다. */
.u4aWsBusyAura {
    display: none;
}

.u4aWsBusyIndicator[data-u4a-busy-mode="ai"] .u4aWsBusyAura {
    display: block;
    position: fixed;
    inset: 0;
    pointer-events: none;

    /* 빛은 바깥 테두리를 꽉 채우고, 안쪽을 **둥근 사각형**으로 뚫는다.
       네 변 그라데이션을 더하는 방식은 모서리에서 두 변이 다 옅어져 빛이 끊긴다(실측 2026-10-30). */
    overflow: hidden;
}

.u4aWsBusyIndicator[data-u4a-busy-mode="ai"] .u4aWsBusyAura i {
    position: absolute;
    inset: 0;
    display: block;

    /* 화면 가운데에서 바깥으로 퍼지는 빛 — 경계선이 아예 없다.
       가운데는 완전히 투명하고, 가장자리로 갈수록 서서히 진해진다. */
    background: radial-gradient(ellipse at center,
                                transparent 0%,
                                transparent 58%,
                                color-mix(in srgb, var(--busy-accent) 14%, transparent) 78%,
                                color-mix(in srgb, var(--busy-accent) 30%, transparent) 92%,

    50%      { opacity: 1; }

/* ======================================================================
   가운데 그림 = 시안 「18안 · 개발 툴킷」 04번 API Call  (장군님 지시 2026-10-30)
   ----------------------------------------------------------------------
   WS 앱(왼쪽 로고)에서 서버(오른쪽 칸 3개)로 GET 이 날아가고, 서버가 깜빡여 처리한 뒤
   JSON 이 돌아오면 "200 OK" 가 뜬다 — 서버와 통신하는 중이라는 뜻.
   짝 마크업 = u4a-busy.js 의 _create():
     <div class="u4aWsBusyApi"><svg class="logo">…</svg><b class="wire"></b>
       <span class="pk req"><em>GET</em></span><span class="pk res"><em>JSON</em></span>
       <div class="srv"><i></i><i></i><i></i></div><span class="ok">200 OK</span></div>
   색은 이 파일 위쪽의 --busy-* 토큰을 그대로 쓴다(테마가 바뀌면 같이 바뀐다).
   ====================================================================== */

.u4aWsBusyApi {
    position: relative;
    width: 124px;
    height: 60px;
    font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
}

/* 화면 쪽 전역 스타일이 이 그림을 찌그러뜨리지 않게 막는다(기존 로고 블록과 같은 방어). */
.u4aWsBusyApi,
.u4aWsBusyApi * {
    box-sizing: border-box;
}

/* 앱(왼쪽) — 응답이 도착하면(78%) 빛난다 */
.u4aWsBusyApi .logo {
    position: absolute;
    left: 0;
    top: 18px;
    width: 26px;
    height: 27px;
    fill: var(--busy-accent);
    animation: u4aWsBusyApiApp 3.2s infinite;
}

@keyframes u4aWsBusyApiApp {
    0%, 76%, 100% { filter: drop-shadow(0 0 3px var(--busy-glow)); }
    82% { filter: drop-shadow(0 0 10px var(--busy-glow)); }
}

/* 통신 선 */
.u4aWsBusyApi .wire {
    position: absolute;
    left: 32px;
    right: 30px;
    top: 31px;
    height: 1px;
    background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--busy-accent) 45%, transparent) 0 3px, transparent 3px 6px);
}

/* 요청 · 응답 조각 (위에 작은 글씨) */
.u4aWsBusyApi .pk {
    position: absolute;
    left: 32px;
    top: 28px;
    width: 8px;
    height: 7px;
    border-radius: 2px;
    opacity: 0;
}

.u4aWsBusyApi .pk em {
    position: absolute;
    left: 50%;
    bottom: 9px;
    font-size: 7px;
    font-style: normal;
    font-weight: 700;
    letter-spacing: 0.04em;
    transform: translateX(-50%);
}

.u4aWsBusyApi .req {
    background: var(--busy-accent);
    box-shadow: 0 0 6px var(--busy-glow);
    animation: u4aWsBusyApiReq 3.2s infinite;
}

.u4aWsBusyApi .req em { color: var(--busy-accent); }

.u4aWsBusyApi .res {
    background: var(--busy-accent-2);
    box-shadow: 0 0 6px var(--busy-accent-2);
    animation: u4aWsBusyApiRes 3.2s infinite;
}

.u4aWsBusyApi .res em { color: var(--busy-accent-2); }

@keyframes u4aWsBusyApiReq {
    0%, 4% { transform: translateX(0); opacity: 0; animation-timing-function: cubic-bezier(0.5, 0, 0.5, 1); }
    8% { opacity: 1; }
    32% { transform: translateX(54px); opacity: 1; }
    36%, 100% { transform: translateX(54px); opacity: 0; }
}

@keyframes u4aWsBusyApiRes {
    0%, 46% { transform: translateX(54px); opacity: 0; animation-timing-function: cubic-bezier(0.5, 0, 0.5, 1); }
    50% { opacity: 1; }
    74% { transform: translateX(0); opacity: 1; }
    78%, 100% { transform: translateX(0); opacity: 0; }
}

/* 서버 — 칸 3개가 처리하는 동안(36~46%) 차례로 깜빡인다 */
.u4aWsBusyApi .srv {
    position: absolute;
    right: 0;
    top: 16px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    width: 24px;
}

.u4aWsBusyApi .srv i {
    height: 7px;
    border-radius: 2px;
    border: 1px solid color-mix(in srgb, var(--busy-accent) 55%, transparent);
    background: color-mix(in srgb, var(--busy-accent) 12%, transparent);
    animation: u4aWsBusyApiSrv 3.2s infinite;
}

.u4aWsBusyApi .srv i:nth-child(2) { animation-delay: 0.1s; }
.u4aWsBusyApi .srv i:nth-child(3) { animation-delay: 0.2s; }

@keyframes u4aWsBusyApiSrv {
    0%, 34%, 50%, 100% { background: color-mix(in srgb, var(--busy-accent) 12%, transparent); }
    40% { background: var(--busy-accent-2); }
}

/* 응답 도착 -> 200 OK */
.u4aWsBusyApi .ok {
    position: absolute;
    left: 50%;
    top: 2px;
    padding: 1px 6px;
    font-size: 8px;
    font-weight: 700;
    color: var(--busy-accent-2);
    border: 1px solid color-mix(in srgb, var(--busy-accent-2) 60%, transparent);
    border-radius: 99px;
    transform: translateX(-50%);
    opacity: 0;
    animation: u4aWsBusyApiOk 3.2s infinite;
}

@keyframes u4aWsBusyApiOk {
    0%, 76% { opacity: 0; transform: translate(-50%, 4px); }
    82%, 92% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, 0); }
}

                        + " lastChangeBeforeOff=" + (oW.lastBeforeOff < 0 ? "none" : oW.lastBeforeOff + "ms")

    /* ==================================================================

     * ------------------------------------------------------------------
     * [2026-10-30 장군님 지시] 「setAIBusy 를 실행중에 다른 setBusy 가 켜지는건 막는걸로 해줘」

     *   (장군님 지적 2026-10-30 「처리가 다 끝나고 메시지가 나와야 하지 않아?」).

     *   · AI 자물쇠로 끄기가 막혀 있으면 그동안 기다렸다가, AI busy 가 꺼질 때 같이 불린다.
     *

     *   ② **「떠 있나」를 .open 으로만 봤다.** showModal() 이 실패하면 display:flex 로 띄우는데
     *      그때 .open 은 false 다 → busy 가 화면에 떠 있는데도 토스트를 **바로** 띄웠다.

    var aAfterOff = [];

    /**
     * busy 가 지금 화면에 보이나.
     *   showModal() 로 열렸으면 .open 이 true 다. 그것이 없거나 실패해 display 로 띄운 경우는

        var oBusyDom = document.getElementById(BUSY_ID);

        if (!oBusyDom) {
            return false;
        }

        if (oBusyDom.open === true) {
            return true;
        }

        return oBusyDom.style.display === "flex";
    }

    /** busy 창이 **실제로 닫히는** 그 순간에도 대기열을 비운다(위 ★① 참조). 창마다 한 번만 건다. */

            //   끄기 직후 microtask 안에서 바로 다시 켜는 흐름에서 그렇게 됐다

     *   화면·동작은 **공통 busy 그대로**다 — 아래에서 show() / hide() 를 그대로 부른다.
     *   다른 점은 카드에 **무슨 작업 중인지 글(desc)을 띄운다**는 것뿐이다.

     *     통째로 그만둔다. 공통 busy 층만 막으면 그 바깥의 부수 작업(마우스 막기 풀기 ·
     *     창 닫기 버튼 활성 · busy 카드 글자 덮어쓰기)이 그대로 돌아 AI busy 가 깨진다.

    global.setAIBusy = setAIBusy;

<body>

<div class="bar">
  <button id="b1">① 보통 busy 켜기 (1)</button>
  <button id="b2">② 보통 busy 끄기 (2)</button>
  <button id="b3">③ AI busy 켜기 (3)</button>
  <button id="b4">④ AI busy 끄기 (4)</button>
  <span id="s"></span>
</div>
<p class="hint">
busy 가 켜지면 <b>화면 전체를 덮어</b> 위 단추를 마우스로 누를 수 없습니다(원래 그렇게 만든 것입니다).<br>
그래서 <b>숫자키 1 · 2 · 3 · 4</b> 로도 같은 일을 할 수 있게 해 뒀습니다. busy 가 떠 있으면 <b>키로</b> 끄십시오.<br>
<b>자물쇠 확인</b> : <b>3</b> 으로 AI busy 를 켜 놓고 <b>1</b> · <b>2</b> 를 눌러 보십시오 — 그림이 바뀌지 않고 그대로면 통과입니다.
</p>
<script>
function fnBusyOn() {
    U4ABusy.show();
}
function fnBusyOff() {
    U4ABusy.hide();
}
function fnAiOn() {
    setAIBusy(true, { desc: "작업중입니다. \n 잠시만 기다려 주세요" });
}
function fnAiOff() {
    setAIBusy(false);
}

var oActions = {
    "b1": fnBusyOn,
    "b2": fnBusyOff,
    "b3": fnAiOn,
    "b4": fnAiOff
};

Object.keys(oActions).forEach(function (sId) {
    document.getElementById(sId).addEventListener("click", oActions[sId]);
});

// busy 가 화면을 덮어 단추를 못 누르므로 숫자키로도 같은 일을 한다.
var oKeys = {
    "1": fnBusyOn,
    "2": fnBusyOff,
    "3": fnAiOn,
    "4": fnAiOff
};

document.addEventListener("keydown", function (oEvent) {
    var fn = oKeys[oEvent.key];
    if (!fn) {
        return;
    }
    oEvent.preventDefault();
    fn();
}, true);

window.addEventListener("load", function () {
    var sState = (typeof setAIBusy === "function") ? "loaded" : "NOT loaded";
    document.getElementById("s").textContent = sState;
});
</script>

</body>
